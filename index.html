<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneme Yanılma Studio | Motion Design & Digital Visual Assets</title>
  <meta name="description" content="Official portfolio of Deneme Yanılma Studio. Specializing in 2D/3D motion graphics, transparent social media stickers, and looping vector animations.">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #131316;
      --card-border: #222226;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --text-dim: #52525b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      padding: 0;
      margin: 0;
    }
    .wrapper {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }
    
    /* Navigation */
    nav {
      border-bottom: 1px solid var(--card-border);
      padding: 22px 0;
      position: sticky;
      top: 0;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span { color: var(--accent); }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }

    /* Hero */
    header.hero {
      padding: 90px 0 60px 0;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 3.2rem;
      line-height: 1.15;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: -1.2px;
    }
    p.lead {
      color: var(--text-muted);
      font-size: 1.25rem;
      max-width: 720px;
      margin: 0 auto 35px auto;
      font-weight: 400;
    }

    /* Section Headings */
    .section-header {
      margin-bottom: 40px;
      text-align: center;
    }
    .section-header h2 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .section-header p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 580px;
      margin: 0 auto;
    }

    /* Portfolio Gallery */
    section { padding: 60px 0; border-bottom: 1px solid var(--card-border); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #3f3f46;
    }
    .preview-box {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 6px; font-weight: 600; }
    .card p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.4; }
    .asset-tag {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.75rem;
      padding: 3px 10px;
      background: #27272a;
      border-radius: 4px;
      color: #d4d4d8;
    }

    /* Process Section */
    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }
    .process-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
    }
    .step-num {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .process-box h3 { font-size: 1.1rem; margin-bottom: 10px; }
    .process-box p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }

    /* Quality / Specs Table */
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .specs-table th, .specs-table td {
      padding: 16px 20px;
      text-align: left;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--card-border);
    }

      background: #18181b;
      color: #fff;
      font-weight: 600;
